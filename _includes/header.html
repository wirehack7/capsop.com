<header class="header">
    <div class="navigation">
        <a href="/" class="logo">{{ site.title }}</a>

        <ul class="menu">
            <li class="menu__entry"><a href="{{ '/about' | prepend: site.baseurl }}">About</a></li>
            <li class="menu__entry"><a href="{{ '/' | prepend: site.baseurl }}">Blog</a></li>
        </ul>
    </div>

    <ul class="social-links">
        {% if site.author.github %}
        <li><a href="https://github.com/{{ site.author.github }}" class="social-links__entry" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 16 16" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a></li>
        {% endif %}

        {% if site.author.twitter %}
        <li><a href="https://twitter.com/{{ site.author.twitter }}" class="social-links__entry" target="_blank" rel="noopener" aria-label="Twitter / X">
            <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644Z"/></svg>
        </a></li>
        {% endif %}

        <li><a href="https://profile.hackthebox.com/profile/019eff03-4d33-7097-be3d-f2e51ba6551d" class="social-links__entry" target="_blank" rel="noopener" aria-label="Hack The Box">
            <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M11.996 0a1.12 1.12 0 0 0-.55.146L1.128 6.007a1.11 1.11 0 0 0-.552.964v11.652c0 .4.211.769.552.965l10.317 5.86a1.12 1.12 0 0 0 1.108 0l10.317-5.86a1.11 1.11 0 0 0 .553-.965V6.971c0-.4-.211-.768-.553-.964L12.552.146a1.12 1.12 0 0 0-.556-.146Zm-.006 2.309 8.207 4.662-8.198 4.702L3.79 6.971l8.2-4.662ZM2.774 8.727l8.11 4.673v9.106l-8.11-4.606V8.727Zm18.44 0v9.173l-8.11 4.606V13.4l8.11-4.673Z"/></svg>
        </a></li>

        <li><a href="#" class="social-links__entry" id="matrix" aria-label="Toggle Matrix rain"><span aria-hidden="true">&para;</span></a></li>

        <li>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span class="theme-toggle__track">
                    <svg class="theme-toggle__icon theme-toggle__sun" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2 12h2.2M19.8 12H22M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
                    <svg class="theme-toggle__icon theme-toggle__moon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                </span>
            </button>
        </li>
    </ul>
</header>
