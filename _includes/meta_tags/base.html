<meta charset="UTF-8">
<script>
// Resolve theme before paint: stored choice wins, else the visitor's OS setting.
// Keep this script free of angle brackets and the and-and operator: jemoji runs
// emoji pages through Nokogiri, which entity-escapes those inside inline scripts.
(function () {
  var mode;
  try { mode = localStorage.getItem('theme'); } catch (e) {}
  if (mode !== 'dark') {
    if (mode !== 'light') {
      mode = 'light';
      if (window.matchMedia) {
        if (matchMedia('(prefers-color-scheme: dark)').matches) { mode = 'dark'; }
      }
    }
  }
  document.documentElement.setAttribute('data-theme', mode);
})();
</script>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %} {{ page.title }} — {{ page.subtitle }} &raquo; {% endif %} {{ site.title }}</title>
<meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
{% if page.tags %}<meta name="keywords" content="{{ page.tags | join: ', ' }}">{% endif %}
<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.url }}">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="alternate" type="application/rss+xml" title="CapsOp Blog RSS" href="/feed.xml">
