# Site settings
title: CapsOp
name: CapsOp
description: >
  IT-Security blog of wirehack7. Writing about malware hunting, botnet shutdowns,
  pentesting and securing IT architecture.

baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://capsop.com" # the base hostname & protocol for your site
timezone: "Europe/Berlin"
encoding: utf-8

author:
  fullname: wirehack7
  # googleplus: https://www.google.com/+MotaquillahMaddane
  github: wirehack7
  twitter: wirehack7
  # disqus: capsop

# Analytics: Umami (cookieless), embedded in _includes/meta_tags/includes.html

# Syntax highlighting is done at build time by Rouge; theme lives in _sass/_syntax.scss

# Handling Reading
exclude: ["README.md", "README.html", "Gemfile", "Gemfile.lock", "_config.yml.template", "Dockerfile", "deploy", "vendor"]

# Build settings
highlighter: rouge
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

plugins:
  - jekyll-sitemap
  - jekyll-feed
# jemoji / jekyll-mentions removed: they post-process every page through Nokogiri,
# which entity-escapes < > & inside inline <script> tags on any page containing an
# emoji or @mention, silently breaking the JS. Emoji render natively in browsers.
