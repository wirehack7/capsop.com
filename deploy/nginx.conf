server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;

    error_page 404 /404.html;
    error_page 403 /403.html;

    # carried over from the old .htaccess
    location = /lightaidra-cc-investigation {
        return 301 /itsec/2014/05/17/lightaidra-cc-investigation.html;
    }

    # drop trailing slash on file-like URLs (old .htaccess rule)
    location ~ "^(?<path>/.+\.(?:html?|png|jpe?g|gif))/$" {
        return 301 $path;
    }

    location /assets/ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
